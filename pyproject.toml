[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evprior"
version = "0.1.0"
description = "Pre-trip and dynamic remaining-energy prediction for battery-electric vehicles"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0,<2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
